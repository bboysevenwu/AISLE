; =====================================================================
; 2000 (PAP) 借機 / PM 看板設定（config/tool_board.ini 是共用設定）
; ---------------------------------------------------------------------
; 寫法注意：字串一律加雙引號；代碼寫進資料庫，上線後不要改代碼
; =====================================================================

; ---------------------------------------------------------------------
; 機台清單：一行一台，看板由上到下依這裡的順序
;   同一台不能同時列在兩個機型
; ---------------------------------------------------------------------
[tools]
tool[] = "APAP01"
tool[] = "APAP02"
tool[] = "APAP03"

; ---------------------------------------------------------------------
; 可新增 / 修改 / 拖曳 / 刪除這個機型 Action 的 AISLE 帳號，一行一個
;   必須是 EE 帳號（不是 EE 的會被忽略）；ADMIN 不必列，一律可以
;   沒列在這裡的 EE、以及所有 PE 都是唯讀
; ---------------------------------------------------------------------
[editors]
account[] = "neo"

; ---------------------------------------------------------------------
; WIP 處理方式：[wip.<代碼>]，這個機型的 Action 表單可勾選的項目（依這裡的順序）
;   label       顯示名稱
;   text_color  色塊文字顏色（Hex）
;   bold        On = 粗體
;   要擴充就再加一個 [wip.<代碼>] 區段，表單自動多一個選項
; ---------------------------------------------------------------------
[wip.purge]
label      = "Purge WIP"
text_color = "#FF3B3B"
bold       = On

[wip.non_purge]
label      = "Non-Purge WIP"
text_color = "#FFFFFF"
bold       = Off

; ---------------------------------------------------------------------
; （選填）覆蓋共用設定，例如這個機型 Pilot 也算停機：
; [availability]
; count_pilot = On
; ---------------------------------------------------------------------
