; =====================================================================
; 圖表 Demo（chart_demo）的圖表設定
; ---------------------------------------------------------------------
; 由 modules/chart_demo/ChartConfig.php 讀取，存檔後重新整理頁面即生效。
;
; 每個 [chart.<代號>] 是一組圖表：params 列出的參數畫在同一張圖上。
; 頁面三個區塊會依本檔的順序，各自為每一組畫一張圖：
;   single  單台機台趨勢          （上方選擇的那一台，每個參數一條線）
;   newest  最新值排排站          （每台在區間內的最後一筆，每個參數一根長條）
;   tbt     歷史趨勢排排站        （每台一個區段，每個參數一條線）
; single / newest / tbt 設 Off 就不畫該組的那張圖，省略時為 On。
;
; 欄位：
;   title   圖表標題
;   params  參數名稱，逗號分隔，必須與後端資料 Data 裡的 key 一致（區分大小寫）
;   unit    Y 軸名稱（選用，預設 "Data"）
;   single / newest / tbt   On / Off
;   ymin / ymax         Y 軸下限 / 上限（選用，套用到該組三張圖；不設或留空 = 自動）
;   single_ymin / single_ymax、newest_ymin / newest_ymax、tbt_ymin / tbt_ymax
;                       只設定某一區塊的上下限，優先於 ymin / ymax
;   超出上下限的資料會被裁切，不會畫出圖外
;
; 寫法注意：字串一律加雙引號；<代號> 只能用小寫英文、數字、底線
; =====================================================================

[chart.m1bf_z]
title  = "M1BF_Z"
params = "M1BF_Z_C1, M1BF_Z_C2"
single = On
newest = On
tbt    = On
; 三張圖 Y 軸都是 0 ~ 6，最新值排排站另外設 0 ~ 5
ymin   = 0
ymax   = 6
newest_ymax = 5

[chart.m1bf_ry]
title  = "M1BF_Ry"
params = "M1BF_Ry_C1, M1BF_Ry_C2"
single = On
newest = Off
tbt    = On
; 只設歷史趨勢排排站的上下限，單台趨勢維持自動
tbt_ymin = 0
tbt_ymax = 6
