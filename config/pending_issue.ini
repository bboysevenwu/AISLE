; =====================================================================
; Pending Issue Control Table 設定（modules/pending_issue）
; ---------------------------------------------------------------------
; 每次請求重新讀取，存檔後立即生效。
; 誰能使用這個頁面由 config/config.ini 的 [access] 與 [page.pending_issue] 決定。
;
; 寫法注意（與 config.ini 相同）：
;   1. 字串一律加雙引號
;   2. 代碼（等號左邊）會寫進資料庫，上線後不要改代碼，只改顯示名稱
; =====================================================================

; ---------------------------------------------------------------------
; 機型：代碼 = 顯示名稱，頁面上方的機型頁籤依這裡的順序
;   輸入機台代號時，代號包含機型代碼（不分大小寫）就自動判定為該機型，
;   例 APAN01 → PAN（和 charts 的 model.* 規則一致）；判定不到才需要手動選
; ---------------------------------------------------------------------
[models]
PAN = "1980 (PAN)"
PAP = "2000 (PAP)"
POV = "YSM (POV)"

; ---------------------------------------------------------------------
; Issue 分類
; ---------------------------------------------------------------------
[categories]
hl          = "PE/YED HL"
tool_select = "選機表"
aging_parts = "Aging parts"
others      = "Others"

; ---------------------------------------------------------------------
; Issue 狀態（只能改顯示名稱；open / monitor / close 三個代碼程式有用到）
;   close 會記錄結案時間；Check point 逾期只提醒 open / monitor
; ---------------------------------------------------------------------
[status]
open    = "Open"
monitor = "Monitor"
close   = "Close"

; ---------------------------------------------------------------------
; 可新增 / 編輯 issue 的 AISLE 帳號（正面表列），一行一個，不分大小寫
;   必須是 EE 帳號（不是 EE 的會被忽略）；ADMIN 不必列，一律可以
;   沒列在這裡的 EE 只能查看與匯出（唯讀）；刪除仍只有 ADMIN
;   名單是空的 → 只有 ADMIN 能新增 / 編輯
; ---------------------------------------------------------------------
[editors]
account[] = "neo"

; ---------------------------------------------------------------------
; Sponsor：哪些身份的 AISLE 使用者可以被選為 Sponsor（只列啟用中的帳號）
; ---------------------------------------------------------------------
[sponsor]
roles = "EE,ADMIN"

; ---------------------------------------------------------------------
; 匯出 CSV
;   enabled = Off 時隱藏匯出按鈕，直接開匯出網址也會回 404
; ---------------------------------------------------------------------
[export]
enabled = On

; ---------------------------------------------------------------------
; 圖片上傳
;   max_mb       單張上限（MB）。php.ini 的 upload_max_filesize / post_max_size 也要大於這個值
;   max_per_item 每筆 issue 最多幾張
; ---------------------------------------------------------------------
[upload]
max_mb       = 5
max_per_item = 20

; ---------------------------------------------------------------------
; 多人同步
;   poll_seconds     幾秒輪詢一次（同步別人的修改與「編輯中」）
;   idle_seconds     多久沒操作（滑鼠、鍵盤）就暫停輪詢，讓登入照常逾時；
;                    必須小於 app.ini [security] session_idle
;   presence_seconds 「某某 編輯中」多久沒更新就消失
; ---------------------------------------------------------------------
[sync]
poll_seconds     = 10
idle_seconds     = 300
presence_seconds = 30
