; =====================================================================
; AISLE 功能頁面設定：身份 → 可用頁面清單、頁面路由、註冊名單
; ---------------------------------------------------------------------
; 由 core/Acl.php 以 parse_ini_file($file, true) 讀取，每次請求重新讀取，
; 存檔後立即生效，不需重啟。
;
; 新增一個功能頁面只需要兩步，不必改任何核心程式：
;   1. 在 [access] 把頁面代號加進可以使用它的身份
;   2. 新增 [page.<頁面代號>] 區段，寫上 title 與 route
;
; 寫法注意：
;   1. 字串一律加雙引號（含中文、空白、斜線、括號時不加引號會解析失敗）
;   2. 不可使用 yes / no / true / false / null / none 當作 key
;   3. 修改後可執行 python scripts/python/check_config.py 檢查
; =====================================================================

[settings]
; 登入後預設進入的頁面
default_page     = "dashboard"
; 獨立頁面（route 位於 public/ 底下）送出 POST 時是否檢查 CSRF token
; 既有頁面的表單若尚未加上 <?php echo csrf_field(); ?>，可先設為 Off
direct_page_csrf = On

; ---------------------------------------------------------------------
; 身份定義：key 必須與 users.role 欄位值一致
; ---------------------------------------------------------------------
[roles]
EE    = "EE 工程師"
PE    = "PE 工程師"
ADMIN = "系統管理員"

; ---------------------------------------------------------------------
; ★ 身份 → 可用頁面清單（逗號分隔的頁面代號）
;   同一個頁面同時列在 EE 與 PE，就是兩種身份都能看
;   "*" 代表全部頁面與全部動作（超級身份），註冊永遠無法取得
;   沒列出的頁面一律拒絕
; ---------------------------------------------------------------------
[access]
EE    = "dashboard, shared_report, report_daily, report_weekly, ee_equipment, ee_daily_check, profile, m1bf, pending_issue"
PE    = "dashboard, shared_report, report_daily, report_weekly, pe_recipe, pe_notice, profile, m1bf"
ADMIN = "*"

; ---------------------------------------------------------------------
; ★ 頁面與路由：[page.<頁面代號>]
;   title   選單顯示名稱
;   route   頁面程式位置，三種寫法：
;             "module:<資料夾>"      modules/<資料夾>/controller.php（Controller 類別，可有多個動作）
;             "pages/xxx.php"        一般 PHP 頁面，由 index.php 檢查權限後載入並套用版面
;             "public/xxx.php"       獨立頁面（例如既有網站的舊頁面），使用者直接開啟，
;                                    檔案第一行需 require core/auth_check.php
;           省略 route 時等同 "module:<頁面代號>"
;   order   選單排序，數字小的在前
;   menu    是否出現在選單（Off = 隱藏頁，仍受權限控管）
;   icon    選單前綴字元
;   group   （選用）歸到哪個選單分類，填 [group.<分類代號>] 的代號
;   action.<動作> = "EE,PE"   （選用）單一動作再限制身份，必須同時能使用此頁面
; ---------------------------------------------------------------------

; ---------------------------------------------------------------------
; ★ 選單分類：[group.<分類代號>]（選用）
;   多個頁面寫上相同的 group，就會收在同一個可收折的分類底下
;   title   分類標題
;   order   分類在選單中的位置（和沒有分類的頁面一起排序）；分類內的頁面依各自的 order 排序
;   icon    分類前綴字元
;   open    預設是否展開（On / Off）。使用者點開或收起後，瀏覽器會記住；
;           目前所在頁面的分類一律展開
;   權限仍由 [access] 決定：某身份在分類裡看不到任何頁面時，整個分類不會出現
; ---------------------------------------------------------------------
[group.report]
title = "共用報表 // REPORTS"
order = 20
icon  = "#"
open  = Off


[page.dashboard]
title = "主控台 // DASHBOARD"
route = "module:dashboard"
order = 10
menu  = On
icon  = ">"

[page.shared_report]
title = "Report1 // 綜合報表"
route = "module:shared_report"
group = "report"
order = 1
menu  = On
icon  = "#"
; 兩種身份都能看報表，但只有 PE 可以匯出 CSV
action.export = "PE"

[page.report_daily]
title = "Report2 // 日報"
route = "pages/report_daily.php"
group = "report"
order = 2
menu  = On
icon  = "#"

[page.report_weekly]
title = "Report3 // 週報"
route = "pages/report_weekly.php"
group = "report"
order = 3
menu  = On
icon  = "#"

[page.pending_issue]
title = "Pending Issue // CONTROL TABLE"
route = "module:pending_issue"
order = 28
menu  = On
icon  = "?"
; 只有 EE（與 ADMIN）能使用：查詢、新增、編輯、刪除、匯出
; 機型、分類、Sponsor、匯出開關、輪詢秒數在 config/pending_issue.ini
; 「顯示已刪除」與「還原」只有 ADMIN
action.trash   = "ADMIN"
action.restore = "ADMIN"

[page.ee_equipment]
title = "設備狀態 // EQUIPMENT"
route = "module:ee_equipment"
order = 30
menu  = On
icon  = "~"

[page.ee_daily_check]
title = "每日點檢 // DAILY CHECK"
route = "pages/ee_daily_check.php"
order = 35
menu  = On
icon  = "+"

[page.pe_recipe]
title = "製程配方 // RECIPES"
route = "module:pe_recipe"
order = 40
menu  = On
icon  = "%"

[page.pe_notice]
title = "製程公告 // NOTICE"
route = "public/legacy/pe_notice.php"
order = 45
menu  = On
icon  = "*"

[page.profile]
title = "個人設定 // PROFILE"
route = "module:profile"
order = 90
menu  = On
icon  = "@"

[page.admin_users]
title = "使用者管理 // OPERATORS"
route = "module:admin_users"
order = 99
menu  = On
icon  = "!"

; ---------------------------------------------------------------------
; 註冊與身份判定（由 core/Registration.php 讀取）
;   註冊表單只填帳號、顯示名稱、密碼。身份在註冊當下依下方名單判定並寫入資料庫：
;     帳號列在 [ee_accounts] → listed_role（EE）
;     其他帳號               → unlisted_role（PE）；設為 "" 則名單外的人不能註冊
;   之後修改名單不會改變已註冊者的身份，需要時請由管理員調整資料庫
;   enabled          是否開放自行註冊
;   require_approval On = 註冊後帳號停用，需管理員在「使用者管理」啟用
; ---------------------------------------------------------------------
[register]
enabled          = On
require_approval = Off
listed_role      = "EE"
unlisted_role    = "PE"

; ---------------------------------------------------------------------
; EE 正面表列：一行一個帳號，不分大小寫
; ---------------------------------------------------------------------
[ee_accounts]
account[] = "neo"
account[] = "trinity"
account[] = "morpheus"

; ---------------------------------------------------------------------
; ★ 圖表：每張 chart 一個頁面，route 一律寫 "module:charts"
;   頁面代號 = chart 名稱轉小寫，對應 charts/<名稱>.ini 與 charts/<名稱>.php
;     例：[page.bslr] → charts/BSLr.ini、charts/BSLr.php
;   哪些身份看得到：把頁面代號加到上方 [access] 對應身份的清單
;   新增 chart：bash scripts/shell/new_chart.sh <名稱>，再把它印出的區段貼到這裡
; ---------------------------------------------------------------------
[group.charts]
title = "圖表 // CHARTS"
order = 50
icon  = "^"
open  = On

[page.m1bf]
title = "M1BF"
route = "module:charts"
group = "charts"
order = 10
menu  = On
icon  = "^"
