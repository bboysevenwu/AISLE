; =====================================================================
; 機台借機與 PM 排程看板 共用設定（modules/tool_board）
; ---------------------------------------------------------------------
; 每次請求重新讀取，存檔後立即生效。
; 誰能進這個頁面由 config/config.ini 的 [access] 與 [page.tool_board] 決定；
; 每個機型「哪幾位 EE 可以編輯」、機台清單、WIP 處理方式寫在 config/tool_board/<機型>.ini。
;
; 寫法注意（與 config.ini 相同）：
;   1. 字串一律加雙引號
;   2. 代碼（[category.<代碼>] 的代碼）會寫進資料庫，上線後不要改代碼，只改顯示名稱與顏色
;   3. 修改後可執行 python scripts/python/check_config.py 檢查
; =====================================================================

; ---------------------------------------------------------------------
; 機型：代碼 = 頁籤顯示名稱，頁籤依這裡的順序
;   每個機型要有一個 config/tool_board/<代碼>.ini（例 config/tool_board/PAN.ini）
; ---------------------------------------------------------------------
[models]
PAN = "1980 (PAN)"
PAP = "2000 (PAP)"
POV = "YSM (POV)"

; ---------------------------------------------------------------------
; 看板
;   days_before / days_after  時間視窗：今天往前幾天、往後幾天（今天以伺服器日期為準）
;                             往前的這幾天仍可新增 / 修改（方便補登實際時間），再更早的不能改
;   cell_width                每一天的格子寬度（px）
;   default_start_time        新增 Action 時預帶的起頭時間（表單內可自行調整）
; ---------------------------------------------------------------------
[board]
days_before        = 3
days_after         = 60
cell_width         = 44
default_start_time = "08:00"

; ---------------------------------------------------------------------
; Action 類別：[category.<代碼>]，依這裡的順序出現在表單
;   label          顯示名稱
;   color          色塊背景色（Hex，例 "#E67E22"）
;   counts_down    On = 算停機時間（影響可用率）
;   default_hours  新增時預設的時長（小時）
;   default_wip    （選填）新增時預選的 WIP 處理方式代碼；該機型沒有這個代碼時選第一個
; 機型檔也可以寫 [category.<代碼>]：同代碼覆蓋、新代碼只加在那個機型
; ---------------------------------------------------------------------
[category.schedule]
label         = "Schedule Action"
color         = "#3A7BD5"
counts_down   = On
default_hours = 8

[category.pm]
label         = "PM"
color         = "#E67E22"
counts_down   = On
default_hours = 12
default_wip   = "purge"

[category.short_borrow]
label         = "短借機"
color         = "#8E44AD"
counts_down   = On
default_hours = 4

[category.monitor]
label         = "Monitor"
color         = "#16A085"
counts_down   = On
default_hours = 2

; ---------------------------------------------------------------------
; 每日預估可用率（看板第一列）
;   formula        "default" = 可用時數 / (機台數 × 24h) × 100%
;                  其他名稱例 "fab_hours" → 載入 modules/tool_board/formulas/FabHours.php 的 FabHoursAvailability
;   count_monitor  Monitor 尾巴是否算停機
;   count_pilot    Pilot 尾巴是否算停機（Pilot 有在跑貨，預設不算）
;   warn_below     低於這個百分比格子變黃
;   alert_below    低於這個百分比格子變紅
; 機型檔可以寫 [availability] 覆蓋其中幾項
; ---------------------------------------------------------------------
[availability]
formula       = "default"
count_monitor = On
count_pilot   = Off
warn_below    = 90
alert_below   = 80

; ---------------------------------------------------------------------
; PM 射程：三個機型共用一個 JSON 檔，每個機型只顯示自己機台清單內的機台
;   json_path  伺服器上的絕對路徑；空白 = 不顯示 PM
;              格式：{"APAN01": {"PM": {"window_start_date": "2026-06-01 09:30",
;                                       "first_due": "2026-06-10 09:30",
;                                       "due_date": "2026-06-17 09:30"}, ...}, ...}
;              請用 Python 的 json.dump 輸出；單引號（Python dict 印法）也能讀，但會顯示提醒
;   category   「依此 PM 新增 Action」帶入的類別，也用來判斷射程內是否已排 PM
; ---------------------------------------------------------------------
[pm]
json_path = ""
category  = "pm"

; ---------------------------------------------------------------------
; 多人同步
;   poll_seconds      每幾秒同步一次別人的修改與「編輯中」
;   presence_seconds  多久沒同步就視為已離開
;   idle_seconds      超過幾秒沒操作就暫停同步，讓登入照常逾時（會自動小於 app.ini 的 session_idle）
; ---------------------------------------------------------------------
[sync]
poll_seconds     = 5
presence_seconds = 20
idle_seconds     = 600
