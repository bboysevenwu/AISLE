; =====================================================================
; 1980 (PAN) 選機表設定（config/tool_select.ini 是共用設定）
; ---------------------------------------------------------------------
; 寫法注意：字串一律加雙引號；[item.<代號>] 的代號只能用小寫英文、數字、底線
; 修改後可執行 python scripts/python/check_config.py 檢查
; =====================================================================

; ---------------------------------------------------------------------
; [page]
;   json_path  這個機型數值 JSON 檔在伺服器上的絕對路徑；空白 = 只顯示 spec，數值全部 "-"
;              格式（機台 → 項目 → 值）：
;                {"updated": "2026-11-15 08:00",
;                 "data": {"APAN01": {"M1BF_Ry": 3.21, "LUSU": "Down",
;                                     "SAMOS": {"v": -3.4, "t": "2026-11-15 07:30"}}, ...}}
;              值：數字 → 判斷超規；其他文字 → 狀態（依共用 [status] 上色）；{"v": 值, "t": "時間"} → 附資料時間
;              "updated" 可省略（改顯示檔案修改時間）；也可以省略 "data" 這一層，直接 {"APAN01": {...}}
;              請產生端用 Python json.dump 輸出（雙引號）
;   sample     On = 不讀 JSON，用內建範例值先看畫面（JSON 還沒準備好時用）
; ---------------------------------------------------------------------
[page]
json_path = ""
sample    = On

; ---------------------------------------------------------------------
; 機台：一行一台，表格由左到右依這裡的順序
; ---------------------------------------------------------------------
[tools]
tool[] = "APAN01"
tool[] = "APAN02"
tool[] = "APAN03"
tool[] = "APAN04"
tool[] = "APAN05"
tool[] = "APAN06"

; ---------------------------------------------------------------------
; 分類：代號 = 顯示名稱，依這裡的順序（也是分類下拉選單的順序）
;   代號只能用小寫英文、數字、底線
; ---------------------------------------------------------------------
[category]
focus = "Focus"
illum = "Illumination"
ovl   = "OVL"
lens  = "Lens"

; ---------------------------------------------------------------------
; 項目：[item.<代號>]，同分類的項目排在一起（分類依上面的順序），同分類內依這裡的順序
;
;   category   分類代號（必填，必須在 [category] 裡）
;   label      顯示名稱（省略 = 代號）
;   key        JSON 裡這個項目的名稱（省略 = 代號），比對不分大小寫
;   unit       單位（選用，顯示在項目名稱後）
;   decimals   數值顯示幾位小數（選用，省略 = 照原值）
;   upper_oos / upper_ooc / lower_ooc / lower_oos
;              spec（選用，留空 = 不判斷那一條）；有填的值必須符合
;              lower_oos <= lower_ooc < upper_ooc <= upper_oos
;              判定：大於 upper / 小於 lower 才算超出，剛好等於界限算正常
;   upper_oos.<機台> 等
;              ★ 機台覆蓋（選用）：只有這台用不同的 spec，只寫要不同的那幾條；
;              留空（例 lower_ooc.APAN03 =）= 這台不判斷這一條。機台必須在 [tools] 裡
;   target / target.<機台>
;              ★ 各機台 target（選用）。這個項目有寫任何一行 target（含留空的 target =）就變成「偏移模式」：
;              upper_oos / upper_ooc / lower_ooc / lower_oos（含機台覆蓋）改成「距離 target 多遠」，一律填 >= 0，
;              判斷時用 target + upper_xxx 與 target - lower_xxx；同側 OOS 要 >= OOC，上下同一層不能同時為 0
;                target         預設（省略或留空 = 0）
;                target.APAN01  這台的 target（不分大小寫，機台必須在 [tools] 裡）
;              表格的 spec 欄顯示帶正負號的偏移量，項目名稱旁標 ±T；滑鼠移到數值格看該台的 target 與 spec
;   href       點項目名稱開的頁面（選用，可留空 = 沒有連結），一律開新分頁：
;                "?m=m1bf"               AISLE 內部頁面（自動接上網站路徑前綴）
;                "?m=m1bf&tool={tool}"   點數值格時 {tool} 換成那一欄的機台，chart 會預選那台；
;                                        點項目名稱時 {tool} 換成空白
;                "/xxx"、"http(s)://..." 其他網址
;   ooc_bg / oos_bg / ooc_bg_light / oos_bg_light
;              這個項目自己的超規底色（選用，覆蓋共用 [color]）
; ---------------------------------------------------------------------
[item.m1bf_ry]
category  = "focus"
label     = "M1BF Ry"
key       = "M1BF_Ry"
unit      = "nm"
decimals  = 2
upper_oos = 5.5
upper_ooc = 5
lower_ooc =
lower_oos =
upper_oos.APAN03 = 6
upper_ooc.APAN03 = 5.5
href      = "?m=m1bf&tool={tool}"

[item.m1bf_z]
category  = "focus"
label     = "M1BF Z"
key       = "M1BF_Z"
unit      = "nm"
decimals  = 2
; 示範偏移模式：APAN01 判斷 4.5 / 4.2 / 1.8 / 1.5，沒寫 target 的機台用 2.5
target        = 2.5
target.APAN01 = 3
target.APAN02 = 3.2
upper_oos = 1.5
upper_ooc = 1.2
lower_ooc = 1.2
lower_oos = 1.5
href      = "?m=m1bf&tool={tool}"

[item.lusu]
category  = "illum"
label     = "LUSU"
key       = "LUSU"
decimals  = 2
upper_oos = 3
upper_ooc = 2.5
lower_ooc = -2.5
lower_oos = -3
href      =

[item.samos]
category  = "ovl"
label     = "SAMOS"
key       = "SAMOS"
decimals  = 2
upper_oos = 3
upper_ooc = 2.5
lower_ooc = -2.5
lower_oos = -3
; 這一項超出 OOC 用比較亮的橘色
ooc_bg       = "#A0522D"
ooc_bg_light = "#FFC08A"

[item.bslr_ty]
category  = "ovl"
label     = "BSLr Ty"
key       = "BSLr_Ty"
decimals  = 1
upper_oos = 8
upper_ooc = 6
lower_ooc = -6
lower_oos = -8

[item.spherical]
category  = "lens"
label     = "Spherical"
key       = "Spherical"
decimals  = 1
upper_oos = 12
upper_ooc = 10
lower_ooc = -10
lower_oos = -12
