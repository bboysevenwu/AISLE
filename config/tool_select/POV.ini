; =====================================================================
; YSM (POV) 選機表設定（config/tool_select.ini 是共用設定）
; ---------------------------------------------------------------------
; 寫法注意：字串一律加雙引號；[item.<代號>] 的代號只能用小寫英文、數字、底線
; 修改後可執行 python scripts/python/check_config.py 檢查
; =====================================================================

; ---------------------------------------------------------------------
; [page] json_path / sample，說明見 config/tool_select/PAN.ini
; ---------------------------------------------------------------------
[page]
json_path = ""
sample    = On

; 機台：一行一台，表格由左到右依這裡的順序
[tools]
tool[] = "APOV01"
tool[] = "APOV02"
tool[] = "APOV03"

; 分類：代號 = 顯示名稱，依這裡的順序
; 限定身份：<代號>.view = "EE"（逗號分隔多個；留空 = 只有 ADMIN）；項目也可寫 view，說明見 PAN.ini
[category]
focus = "Focus"
ovl   = "OVL"

; 項目：[item.<代號>]，欄位說明見 config/tool_select/PAN.ini
[item.m1bf_ry]
category  = "focus"
label     = "M1BF Ry"
key       = "M1BF_Ry"
unit      = "nm"
decimals  = 2
upper_oos = 5.5
upper_ooc = 5
href      = "?m=m1bf&tool={tool}"

[item.samos]
category  = "ovl"
label     = "SAMOS"
key       = "SAMOS"
decimals  = 2
upper_oos = 3
upper_ooc = 2.5
lower_ooc = -2.5
lower_oos = -3
