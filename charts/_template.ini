; =====================================================================
; chart 設定檔範本：複製成 charts/<名稱>.ini（或用 scripts/shell/new_chart.sh <名稱>）
; ---------------------------------------------------------------------
; 每張 chart 有兩個同名檔案：
;   charts/<名稱>.ini   本檔：畫什麼、怎麼畫、連哪個資料庫
;   charts/<名稱>.php   部署者寫 SQL、整理成資料格式
; 並在 config/config.ini 加一個頁面（頁面代號 = 名稱轉小寫）：
;   [page.<小寫名稱>]  route = "module:charts"  group = "charts"
; 存檔後重新整理頁面即生效。
;
; 寫法注意：字串一律加雙引號；[plot.<代號>] 的代號只能用小寫英文、數字、底線
; =====================================================================

; ---------------------------------------------------------------------
; [page] 整頁設定（都可省略）
;   source        php    = 用 charts/<名稱>.php 查資料庫（預設）
;                 sample = 內建範例資料，SQL 還沒寫好時先看畫面
;   default_days  進頁面預設顯示最近幾天（預設 60）
;   max_days      一次最多查幾天（預設 366）
;   quick_days    快速區間按鈕（預設 "7, 30, 90"）
;   model.<機型>  機台代號包含這個字（不分大小寫）就屬於這個機型，
;                 用在「最新值排排站」的機型篩選與機台配色；不設定就沒有機型下拉選單
; ---------------------------------------------------------------------
[page]
source       = sample
default_days = 60
max_days     = 366
quick_days   = "7, 30, 90"
model.1980   = "PAN"
model.2000   = "PAP"

; ---------------------------------------------------------------------
; [db] 這張 chart 查資料用的資料庫連線（charts/<名稱>.php 的 fetchAll 使用）
;   ip        資料庫主機 IP 或名稱。留空 = 直接使用 AISLE 自己的資料庫（config/app.ini 的 [database]），
;             這時 name / user / password 也要留空
;   port      預設 3306
;   name      資料庫名稱（可留空，SQL 裡寫成 資料庫.table）
;   user / password   建議使用只有 SELECT 權限的帳號；一律加雙引號，密碼不要含 " 字元
;   charset   預設 utf8mb4
;
; ★ 安全性：帳號密碼只在主機上的檔案填寫，不要填進 GitHub 上的版本（repo 裡一律留空）。
;   網址讀不到 charts/ 目錄（根目錄 .htaccess 會擋），密碼也不會送到瀏覽器。
;   建議主機上執行 chmod 640 charts/*.ini（擁有者 / 群組讓 Apache 讀得到即可）
; ---------------------------------------------------------------------
[db]
ip       = ""
port     = 3306
name     = ""
user     = ""
password = ""
charset  = "utf8mb4"

; ---------------------------------------------------------------------
; [plot.<代號>] 一組圖：params 列出的參數畫在同一張圖上
; 頁面三個區塊會依本檔的順序，各自為每一組畫一張圖：
;   single  單台機台趨勢          （上方選擇的那一台，每個參數一條線）
;   newest  最新值排排站          （每台在區間內的最後一筆，每個參數一根長條）
;   tbt     歷史趨勢排排站        （每台一個區段，每個參數一條線）
;
; 欄位：
;   title   圖表標題
;   params  參數名稱，逗號分隔，必須與 <名稱>.php 回傳的 Data 裡的 key 一致（區分大小寫）
;   unit    Y 軸名稱（選用，預設 "Data"）
;   single / newest / tbt   On / Off，省略時為 On
;   connect On = 線跨過沒有值的時間點連起來（選用，預設 Off = 斷開）。
;           參數來自取樣時間不同的 table（merge 合併）時，其他參數的時間點會是空值，建議設 On
;   ymin / ymax         Y 軸下限 / 上限（選用，套用到該組三張圖；不設或留空 = 自動）
;   single_ymin / single_ymax、newest_ymin / newest_ymax、tbt_ymin / tbt_ymax
;                       只設定某一區塊的上下限，優先於 ymin / ymax
;   超出上下限的資料會被裁切，不會畫出圖外
;   upper_oos / upper_ooc / lower_ooc / lower_oos
;                       spec 線（選用，留空 = 不畫），三個區塊都會畫成水平線：
;                       OOS（規格界限）紅色實線、OOC（管制界限）橘色虛線
;                       有填的值必須符合 lower_oos <= lower_ooc < upper_ooc <= upper_oos
;                       Y 軸自動時會把 spec 線納入範圍；有設 ymin / ymax 時，超出範圍的線不會畫出
; ---------------------------------------------------------------------
[plot.example]
title  = "EXAMPLE"
params = "EXAMPLE_C1, EXAMPLE_C2"
unit   = "Data"
single = On
newest = On
tbt    = On
upper_oos =
upper_ooc =
lower_ooc =
lower_oos =
